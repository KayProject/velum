[package]
name = "velum"
version = "0.1.0"
edition = "2024_07"
license-file = "../LICENSE"

[dependencies]
starknet = "2.20.0"

[dev-dependencies]
assert_macros = "2.20.0"
snforge_std = "0.63.0"

[[target.starknet-contract]]
sierra = true
casm = true
casm-add-pythonic-hints = true

[scripts]
test = "snforge test"

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

[tool.fmt]
sort-module-level-items = true

[profile.release.cairo]
inlining-strategy = 250
